<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Quest</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Permanent+Marker&display=swap">
<style>
  :root{
    --paper:#F2F4F8; --board:#FFFFFF; --line:#D9DFE8; --line2:#C9D2DF;
    --ink:#26303E; --muted:#68758A; --faint:#98A3B5;
    --red:#D64545; --blue:#2F5FD0; --yellow:#F2C230; --green:#2FA96F;
    --c-math:#2F5FD0; --c-sci:#7A4FC9; --c-fnd:#159A8C; --c-core:#E8862E;
    --c-wri:#D6478F; --c-elec:#5E6C82; --c-ger:#D9A400; --c-free:#7E9C22;
    --grid:rgba(47,95,208,.05);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 28px),
      var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
    font-size:14px;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  button{font-family:inherit; cursor:pointer;}
  button:disabled{cursor:not-allowed;}
  ::-webkit-scrollbar{height:10px; width:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--line2); border-radius:5px;}
  ::-webkit-scrollbar-thumb:hover{background:#AFBACB;}

  /* ============ HUD ============ */
  header{
    flex:0 0 auto; display:flex; align-items:center; gap:12px;
    padding:10px 18px; border-bottom:1px solid var(--line);
    background:var(--board);
    box-shadow:0 1px 4px rgba(38,48,62,.06);
    flex-wrap:wrap;
  }
  .logo{font-family:'Chakra Petch'; font-weight:700; font-size:19px; letter-spacing:.06em; white-space:nowrap; color:var(--ink); line-height:1.05;}
  .logo .q{color:var(--blue);}
  .logo small{display:block; font-size:10px; font-weight:500; letter-spacing:.22em; color:var(--faint); text-transform:uppercase;}
  .hud-group{display:flex; align-items:center; gap:8px;}
  select, .btn{
    background:var(--board); color:var(--ink); border:1px solid var(--line2);
    border-radius:8px; padding:8px 13px; font-size:13px; font-family:inherit; min-height:36px;
  }
  select:focus-visible, .btn:focus-visible, .chip:focus-visible, .node:focus-visible, input:focus-visible, .cat-card:focus-within{outline:2px solid var(--blue); outline-offset:2px;}
  .btn:hover:not(:disabled){background:#F0F3F8; border-color:#AFBACB;}
  .btn.primary{background:var(--blue); color:#fff; border-color:var(--blue); font-weight:600;}
  .btn.primary:hover:not(:disabled){background:#2450B4;}
  .btn.ghost{background:transparent;}
  .btn.danger:hover:not(:disabled){border-color:var(--red); color:var(--red);}
  .btn:disabled{opacity:.4;}
  .xp{flex:1 1 220px; min-width:180px; display:flex; align-items:center; gap:10px;}
  .level-badge{
    font-family:'Chakra Petch'; font-weight:600; font-size:12px; letter-spacing:.08em;
    background:#FFF7DE; border:1px solid var(--yellow); border-radius:999px;
    padding:5px 14px; white-space:nowrap; color:#8A6A00;
  }
  .xp-track{flex:1; height:14px; background:#E8ECF2; border:1px solid var(--line); border-radius:999px; overflow:hidden; display:flex; min-width:60px;}
  .xp-done{background:linear-gradient(90deg,#27935F,var(--green)); height:100%; transition:width .5s cubic-bezier(.2,.8,.2,1);}
  .xp-planned{background:repeating-linear-gradient(-45deg, #A9C0F0 0 6px, #C3D3F5 6px 12px); height:100%; transition:width .5s cubic-bezier(.2,.8,.2,1);}
  .xp-label{font-family:'IBM Plex Mono'; font-size:12px; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums;}
  .xp-label b{color:var(--ink);}
  .eta{
    font-size:12px; color:var(--muted); white-space:nowrap; border:1px dashed var(--line2); border-radius:999px; padding:5px 12px;
  }
  .eta.grad{border-style:solid; border-color:var(--green); color:#1F7A4D; background:#EDF8F2; font-weight:600;}

  /* ============ Tabs ============ */
  nav{flex:0 0 auto; display:flex; gap:6px; padding:10px 18px 0; align-items:flex-end; flex-wrap:wrap;}
  .tab{
    font-family:'Chakra Petch'; font-weight:600; font-size:13px; letter-spacing:.1em; text-transform:uppercase;
    background:transparent; color:var(--muted); border:1px solid transparent; border-bottom:none;
    padding:9px 20px; border-radius:10px 10px 0 0;
  }
  .tab.active{background:var(--board); color:var(--blue); border-color:var(--line); box-shadow:0 -1px 3px rgba(38,48,62,.05);}
  .tab:not(.active):hover{color:var(--ink);}
  nav .spacer{flex:1;}
  .cat-pill{font-size:11.5px; color:var(--muted); padding-bottom:10px; white-space:nowrap;}
  .cat-pill b{color:var(--ink); font-weight:600;}
  .zoomer{display:flex; gap:4px; padding-bottom:6px;}
  .zoomer .btn{padding:4px 11px; font-family:'IBM Plex Mono'; font-size:13px; min-height:30px;}
  .zoomer .btn.fit{font-family:'Chakra Petch'; font-size:11px; letter-spacing:.06em;}

  main{flex:1; min-height:0; display:flex; flex-direction:column; border-top:1px solid var(--line); background:var(--board);}
  .view{flex:1; min-height:0; display:none;}
  .view.active{display:flex; flex-direction:column;}

  /* ============ Skill tree ============ */
  #view-tree{position:relative;}
  #treeWrap{flex:1; overflow:auto; position:relative; cursor:grab; touch-action:pan-x pan-y;
    background:
      repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 28px),
      var(--board);
  }
  #treeWrap.panning{cursor:grabbing;}
  #treeScale{transform-origin:0 0;}
  #treeCanvas{position:relative;}
  #edgeSvg{position:absolute; inset:0; pointer-events:none;}
  .edge{stroke:#9DB4E4; stroke-width:1.7; fill:none; opacity:.9; transition:stroke .15s, opacity .15s;}
  .edge.conc{stroke:#D98A8A;}
  .edge.coreq{stroke:#D98A8A; stroke-dasharray:4 4;}
  .edge.up{stroke:var(--red); stroke-width:2.5; opacity:1;}
  .edge.down{stroke:var(--blue); stroke-width:2.5; opacity:1;}
  .edge.dim{opacity:.12;}
  .lane-label{
    position:absolute; top:14px; font-family:'Chakra Petch'; font-weight:600; font-size:12px;
    letter-spacing:.24em; text-transform:uppercase; color:var(--faint); text-align:center;
  }
  .band-label{position:absolute; font-family:'Chakra Petch'; font-weight:600; font-size:12px; letter-spacing:.24em; text-transform:uppercase; color:var(--faint);}

  .node{
    position:absolute; width:196px; min-height:60px; padding:8px 10px 8px 14px;
    background:var(--board); border:1.5px solid var(--line2); border-radius:10px;
    display:flex; gap:9px; align-items:center; cursor:pointer; -webkit-user-select:none; user-select:none;
    box-shadow:0 1px 3px rgba(38,48,62,.08);
    transition:transform .15s, box-shadow .15s, border-color .15s, opacity .2s;
  }
  .node::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; border-radius:9px 0 0 9px; background:var(--cat);}
  .node .ico{font-size:19px; flex:0 0 auto;}
  .node .tx{min-width:0;}
  .node .code{font-family:'IBM Plex Mono'; font-weight:600; font-size:11px; letter-spacing:.03em; color:var(--cat);}
  .node .opt{font-size:9.5px; color:var(--faint); margin-left:4px; font-family:'IBM Plex Sans'; font-weight:500;}
  .node .nm{font-size:11.5px; line-height:1.25; color:var(--ink); overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .node .cr{
    position:absolute; right:7px; top:7px; font-family:'IBM Plex Mono'; font-size:10px;
    color:var(--muted); background:#F0F3F7; border-radius:5px; padding:1px 5px;
  }
  .node .st{position:absolute; right:7px; bottom:6px; font-size:12px; line-height:1;}
  .node:hover{transform:translateY(-2px); border-color:var(--cat); box-shadow:0 6px 18px rgba(38,48,62,.18); z-index:5;}
  .node.locked{opacity:.5; border-style:dashed; box-shadow:none;}
  .node.locked .ico{filter:grayscale(90%);}
  .node.avail{border-color:var(--yellow); box-shadow:0 0 0 1px rgba(242,194,48,.5), 0 0 14px rgba(242,194,48,.45);}
  .node.avail .st{animation:pulse 1.8s ease-in-out infinite;}
  .node.done{border-color:var(--green); background:linear-gradient(180deg, rgba(47,169,111,.1), rgba(47,169,111,.03)), var(--board);}
  .node.planned{border-color:var(--blue);}
  .node .semtag{
    position:absolute; left:12px; bottom:-9px; font-family:'IBM Plex Mono'; font-size:9.5px; font-weight:600;
    background:#E3ECFC; border:1px solid var(--blue); color:#2450B4; padding:1px 7px; border-radius:999px;
  }
  .node.hl-up{border-color:var(--red); box-shadow:0 0 0 1px rgba(214,69,69,.35); z-index:4;}
  .node.hl-down{border-color:var(--blue); box-shadow:0 0 0 1px rgba(47,95,208,.35); z-index:4;}
  .node.hl-dim{opacity:.3;}
  @keyframes pulse{0%,100%{transform:scale(1); opacity:1;} 50%{transform:scale(1.25); opacity:.6;}}

  #legendCard{
    position:absolute; left:12px; bottom:12px; z-index:6; background:rgba(255,255,255,.95); border:1px solid var(--line);
    border-radius:10px; padding:8px 12px; display:flex; gap:12px; flex-wrap:wrap; max-width:calc(100% - 24px);
    box-shadow:0 4px 14px rgba(38,48,62,.1); font-size:11px; color:var(--muted);
  }
  #legendCard span{display:inline-flex; align-items:center; gap:5px; white-space:nowrap;}
  .dot{width:9px; height:9px; border-radius:3px; display:inline-block;}
  .ln{width:18px; height:0; border-top:2px solid #9DB4E4; display:inline-block;}
  .ln.red{border-color:#D98A8A;}
  .ln.dash{border-top-style:dashed;}

  #tooltip{
    position:fixed; z-index:60; max-width:280px; background:var(--board); border:1px solid var(--line2);
    border-radius:10px; padding:11px 13px; font-size:12px; line-height:1.5; pointer-events:none;
    box-shadow:0 10px 30px rgba(38,48,62,.25); display:none; color:var(--ink);
  }
  #tooltip .t-code{font-family:'IBM Plex Mono'; font-weight:600; color:var(--blue);}
  #tooltip .t-req{color:var(--muted); margin-top:5px;}
  #tooltip .t-req b{color:var(--ink); font-weight:600;}
  #tooltip .t-state{margin-top:6px; font-weight:600;}

  /* ============ Action card ============ */
  #pop{
    position:fixed; z-index:70; width:262px; background:var(--board); border:1px solid var(--line2);
    border-radius:12px; box-shadow:0 14px 40px rgba(38,48,62,.28); padding:12px; max-height:calc(100vh - 16px); overflow-y:auto;
  }
  #pop .p-head{display:flex; gap:8px; align-items:flex-start; margin-bottom:8px;}
  #pop .p-head .ico{font-size:20px;}
  #pop .p-code{font-family:'IBM Plex Mono'; font-weight:600; font-size:12px; color:var(--pcat, var(--blue));}
  #pop .p-nm{font-size:12px; color:var(--muted); line-height:1.3;}
  #pop .p-cr{margin-left:auto; font-family:'IBM Plex Mono'; font-size:11px; color:var(--faint); white-space:nowrap;}
  #pop .p-state{font-size:11.5px; font-weight:600; margin-bottom:6px;}
  .pop-btn{
    display:flex; align-items:center; gap:8px; width:100%; min-height:38px; margin-top:6px;
    background:#F5F7FA; border:1px solid var(--line); border-radius:9px; padding:7px 11px;
    font-size:12.5px; font-weight:500; color:var(--ink); text-align:left;
  }
  .pop-btn:hover{border-color:var(--blue); background:#EEF3FC;}
  .pop-btn.good:hover{border-color:var(--green); background:#EDF8F2;}
  .pop-btn.warn:hover{border-color:var(--red); background:#FCEFEF;}
  #pop .p-sec{margin-top:10px; font-family:'Chakra Petch'; font-size:10px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--faint);}
  .sem-quick{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px;}
  .sem-quick button{
    font-family:'IBM Plex Mono'; font-size:10.5px; font-weight:600; padding:7px 8px; min-height:30px;
    background:#F5F7FA; border:1px solid var(--line); border-radius:7px; color:var(--ink);
  }
  .sem-quick button:hover:not(:disabled){border-color:var(--blue); color:var(--blue);}
  .sem-quick button.cur{background:#E3ECFC; border-color:var(--blue); color:#2450B4;}
  .sem-quick button:disabled{opacity:.35; text-decoration:line-through; text-decoration-color:var(--red);}
  .opt-pick{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px;}
  .opt-pick button{
    font-family:'IBM Plex Mono'; font-size:10.5px; font-weight:600; padding:6px 9px; min-height:30px;
    background:#F5F7FA; border:1px solid var(--line); border-radius:7px; color:var(--ink);
  }
  .opt-pick button.cur{background:#FFF7DE; border-color:var(--yellow); color:#8A6A00;}
  .opt-pick button:hover:not(:disabled){border-color:var(--yellow);}
  .opt-pick button:disabled{opacity:.35;}
  #pop .p-req{margin-top:9px; font-size:11px; color:var(--muted); line-height:1.5;}
  #pop .p-req b{font-family:'IBM Plex Mono'; font-size:10.5px;}

  /* ============ Planner (the whiteboard) ============ */
  #plannerBody{flex:1; min-height:0; display:flex;}
  #bank{
    flex:0 0 240px; border-right:1px solid var(--line); overflow-y:auto; padding:12px;
    background:#EEF1F6;
  }
  #bank h3{
    font-family:'Chakra Petch'; font-weight:600; font-size:11.5px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--muted); margin-bottom:8px; display:flex; justify-content:space-between; align-items:baseline;
  }
  #bank h3 small{font-family:'IBM Plex Mono'; font-size:10px; letter-spacing:0; text-transform:none; color:var(--faint);}
  #bankSearch{
    width:100%; background:var(--board); border:1px solid var(--line2); border-radius:8px;
    padding:9px 11px; font-size:13px; font-family:inherit; color:var(--ink); margin-bottom:6px; min-height:36px;
  }
  #bankSearch::placeholder{color:var(--faint);}
  #bank .hint{font-size:11px; color:var(--faint); margin-bottom:8px; line-height:1.45;}
  .bank-cat{margin:12px 0 5px; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--faint); font-family:'Chakra Petch'; display:flex; align-items:center; gap:6px;}
  .bank-cat::after{content:""; flex:1; height:1px; background:var(--line);}
  .bank-empty{font-size:11.5px; color:var(--faint); padding:8px 2px; line-height:1.5;}
  #cols{
    flex:1; overflow-x:auto; overflow-y:hidden; display:flex; gap:12px; padding:16px 14px; align-items:stretch;
    background:var(--board);
    box-shadow:inset 0 2px 8px rgba(38,48,62,.05);
  }
  .sem-col{
    flex:0 0 196px; display:flex; flex-direction:column; border:1.5px solid var(--line);
    border-radius:12px; background:var(--board); min-height:0; position:relative;
    transition:opacity .15s, filter .15s;
  }
  .sem-col.past{border-color:#BFD8CB; background:#F4FAF6; flex-basis:230px;}
  .sem-col.drag-over{border-color:var(--blue); box-shadow:0 0 0 1px var(--blue), 0 0 16px rgba(47,95,208,.2);}
  .sem-col.blocked{opacity:.5; filter:saturate(.3);}
  .sem-col.blocked .col-lock{display:block;}
  .col-lock{
    display:none; position:absolute; left:10px; right:10px; top:52px; z-index:3;
    background:var(--board); border:1px solid var(--line2); border-radius:9px; padding:8px 10px; text-align:center;
    font-size:11px; color:var(--ink); line-height:1.45; pointer-events:none; box-shadow:0 4px 12px rgba(38,48,62,.12);
  }
  .col-lock b{font-family:'IBM Plex Mono'; font-size:10.5px;}
  .sem-col.shake{animation:shake .35s;}
  @keyframes shake{0%,100%{transform:none;} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);}}
  .col-head{
    padding:10px 10px 6px 12px; border-bottom:2px solid var(--mk, var(--line)); display:flex; align-items:center; gap:6px;
  }
  .col-head .term{font-family:'Permanent Marker', 'Chakra Petch', cursive; font-size:15px; color:var(--mk, var(--ink)); letter-spacing:.02em;}
  .col-head .yr{font-family:'Permanent Marker', cursive; font-size:13px; color:var(--mk, var(--ink)); opacity:.85;}
  .col-head .now{font-family:'Chakra Petch'; font-size:9px; font-weight:700; letter-spacing:.14em; background:#FFF7DE; color:#8A6A00; border:1px solid var(--yellow); border-radius:999px; padding:2px 7px;}
  .col-tools{margin-left:auto; display:flex; gap:1px;}
  .col-tools button{
    background:none; border:none; color:var(--faint); font-size:13px; padding:4px 6px; border-radius:6px; line-height:1; min-width:26px; min-height:26px;
  }
  .col-tools button:hover{background:#F0F3F8; color:var(--ink);}
  .col-tools .col-x:hover{color:var(--red);}
  .col-tools .col-fill:hover{color:#8A6A00;}
  .col-tools .col-done:hover{color:var(--green);}
  .col-body{flex:1; overflow-y:auto; padding:9px; display:flex; flex-direction:column; gap:7px; position:relative;}
  .col-body:empty::before{
    content:"Drop courses here"; display:block; text-align:center; color:var(--faint); font-size:11px;
    border:1.5px dashed var(--line); border-radius:9px; padding:14px 8px; margin-top:4px;
  }
  .sem-col.past .col-body{display:grid; grid-template-columns:1fr 1fr; align-content:start;}
  .sem-col.past .col-body:empty{display:block;}
  .sem-col.past .col-body:empty::before{content:"Courses already passed go here";}
  .col-foot{
    border-top:1px dashed var(--line); padding:6px 12px; font-size:11px;
    color:var(--muted); display:flex; justify-content:space-between; align-items:baseline; gap:6px;
  }
  .col-foot .load b{font-family:'Permanent Marker', cursive; font-size:16px; font-weight:400; color:var(--ink);}
  .col-foot .load.over b{color:var(--red);}
  .col-foot .cum{color:var(--faint); white-space:nowrap;}
  .col-foot .cum b{font-family:'Permanent Marker', cursive; font-size:14px; font-weight:400; color:var(--mk, var(--blue));}
  .col-foot .cum.grad b{color:var(--green);}
  #addSem{
    flex:0 0 150px; border:2px dashed var(--line2); border-radius:12px; background:transparent;
    color:var(--muted); font-family:'Chakra Petch'; font-weight:600; font-size:12px; letter-spacing:.1em;
  }
  #addSem:hover{border-color:var(--blue); color:var(--blue);}

  .chip{
    position:relative; background:var(--board); border:1px solid #D3DAE4; border-radius:8px;
    padding:7px 8px 7px 12px; display:flex; gap:7px; align-items:center; cursor:pointer; -webkit-user-select:none; user-select:none;
    touch-action:pan-y; box-shadow:0 1px 3px rgba(38,48,62,.14);
    transform:rotate(var(--rot, 0deg));
  }
  .chip::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; border-radius:7px 0 0 7px; background:var(--cat);}
  .chip .ico{font-size:15px; flex:0 0 auto;}
  .chip .tx{min-width:0;}
  .chip .code{font-family:'IBM Plex Mono'; font-weight:600; font-size:10.5px; color:var(--cat); display:block; white-space:nowrap;}
  .chip .nm{font-size:10.5px; line-height:1.2; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .chip .cr{margin-left:auto; font-family:'IBM Plex Mono'; font-size:10px; color:var(--faint); flex:0 0 auto;}
  .chip .lab{position:absolute; right:-5px; top:-6px; font-size:10px; background:#fff; border-radius:50%; line-height:1;}
  .chip:hover{border-color:var(--cat);}
  .chip.compact{padding:6px 6px 6px 10px; gap:5px;}
  .chip.compact .nm{display:none;}
  .chip.compact .code{font-size:10px;}
  .chip.compact .ico{font-size:13px;}
  .chip.ghost{position:fixed; z-index:100; pointer-events:none; opacity:.94; transform:rotate(-2.5deg) scale(1.04); box-shadow:0 14px 30px rgba(38,48,62,.35); width:180px;}
  .chip.drag-src{opacity:.3;}

  /* ============ Modal / toast ============ */
  #overlay{position:fixed; inset:0; background:rgba(38,48,62,.45); z-index:80; display:none; align-items:center; justify-content:center; padding:12px;}
  #overlay.open{display:flex;}
  #modal{background:var(--board); border:1px solid var(--line2); border-radius:14px; padding:22px; width:min(460px, 100%); box-shadow:0 24px 60px rgba(38,48,62,.3); max-height:calc(100vh - 24px); overflow-y:auto;}
  #modal h2{font-family:'Chakra Petch'; font-size:17px; letter-spacing:.06em; margin-bottom:8px; color:var(--ink);}
  #modal p{color:var(--muted); font-size:13px; line-height:1.55; margin-bottom:14px;}

  {code:'GER-5', name:'GER: Course Selected from GER List',         cr:3, lane:0, cat:'ger',  ico:'📚'},
  {code:'FRE-1', name:'Free Elective 1',                            cr:3, lane:0, cat:'free', ico:'🃏'},
  {code:'FRE-2', name:'Free Elective 2',                            cr:3, lane:0, cat:'free', ico:'🎪'},
];
const CATS = {
  math:{label:'Math',       col:'var(--c-math)'},
  sci: {label:'Sciences',   col:'var(--c-sci)'},
  fnd: {label:'Foundation', col:'var(--c-fnd)'},
  core:{label:'IE Core',    col:'var(--c-core)'},
  wri: {label:'Writing',    col:'var(--c-wri)'},
  elec:{label:'Tech Elective', col:'var(--c-elec)'},
  ger: {label:'General Ed', col:'var(--c-ger)'},
  free:{label:'Free',       col:'var(--c-free)'},
};
const FILL_PRIORITY = {core:0, math:1, fnd:2, sci:3, wri:4, ger:5, free:6, elec:7};
const MARKERS = ['#26303E','#2456C4','#159A8C','#D63A3A','#E86AA0']; // whiteboard marker colours, one per year
const LEVELS = ['FRESHMAN','SOPHOMORE','JUNIOR','SENIOR','GRADUATE 🎓'];  // 0 / 25 / 50 / 75 / 100 % of credits done
const TERMS = ['Spring','Summer','Fall'];
const byCode = Object.fromEntries(COURSES.map(c=>[c.code,c]));

/* ===================== State & persistence ===================== */
const LS_KEY = 'courseQuest.v2';
let state = null;
function currentTerm(d=new Date()){
  const m=d.getMonth(), y=d.getFullYear();
  return m<=4? {term:'Spring',year:y} : m<=6? {term:'Summer',year:y} : {term:'Fall',year:y};
}
function nextTerm(term,year){ const i=TERMS.indexOf(term); return i===2? {term:'Spring',year:year+1} : {term:TERMS[i+1],year}; }
function uid(p){ return p+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36); }
function genTerms(term,year,n=9){
  const out=[]; let t={term,year};
  for(let i=0;i<n;i++){ out.push({id:uid('s'), term:t.term, year:t.year, courses:[]}); t=nextTerm(t.term,t.year); }
  return out;
}
function newProfile(name, catalog, start){
  return {id:uid('p'), name, catalog, completed:[], semesters:genTerms(start.term,start.year), choices:{}};
}
function sanitizeProfile(p){
  if(!p || typeof p!=='object' || !p.name || !Array.isArray(p.completed) || !Array.isArray(p.semesters)) return null;
  if(!CATALOGS[p.catalog]) p.catalog='26';
  p.choices = p.choices && typeof p.choices==='object' ? p.choices : {};
  p.completed = p.completed.filter(c=>byCode[c]);
  p.semesters = p.semesters.filter(s=>s && s.term && s.year).map(s=>({id:s.id||uid('s'), term:s.term, year:+s.year, courses:(s.courses||[]).filter(c=>byCode[c])}));
  if(!p.id) p.id=uid('p');
  return p;
}
function load(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){ const s=JSON.parse(raw); if(s && s.profiles && s.profiles.length){ s.profiles=s.profiles.map(sanitizeProfile).filter(Boolean); if(s.profiles.length) return s; } }
    const old=localStorage.getItem('courseQuest.v1');
    if(old){ const s=JSON.parse(old); s.profiles=(s.profiles||[]).map(p=>{ p.catalog='26'; return sanitizeProfile(p); }).filter(Boolean); if(s.profiles.length){ s.ui={}; return s; } }
  }catch(e){}
  return null;
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function P(){ return state.profiles.find(p=>p.id===state.activeId) || state.profiles[0]; }

/* ---- undo ---- */
let undoStack=[];
function snap(){ undoStack.push(JSON.stringify(state)); if(undoStack.length>50) undoStack.shift(); refreshUndo(); }
function undo(){
  if(!undoStack.length) return;
  state=JSON.parse(undoStack.pop()); effCache={};
  save(); renderAll(); refreshUndo(); toast('↶ Undone');
}
function refreshUndo(){ document.getElementById('undoBtn').disabled = !undoStack.length; }
document.getElementById('undoBtn').addEventListener('click', undo);
window.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z' && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){ e.preventDefault(); undo(); }
});

/* ===================== Catalog resolution ===================== */
let effCache={};
function inCat(x, cat){ return !x.cats || x.cats.includes(cat); }
function active(){ const cat=P().catalog; return COURSES.filter(c=>inCat(c,cat)); }
function exists(code){ const c=byCode[code]; return !!c && inCat(c,P().catalog); }
/* effective view of a course for the current student: catalog-filtered prerequisites, chosen elective option */
function eff(code){
  if(effCache[code]) return effCache[code];
  const c=byCode[code]; if(!c) return null;
  const prof=P(), cat=prof.catalog;
  const pick = v => (Array.isArray(v)? v : (v? (v[cat]||[]) : [])).filter(exists);
  let e;
  if(c.options){
    const opts=c.options.filter(o=>inCat(o,cat));
    const chosen=opts.find(o=>o.code===prof.choices[code]) || opts[0];
    e={code, disp:chosen.code, name:chosen.name, ico:chosen.ico, cr:c.cr, cat:c.cat, lane:c.lane, slot:c.slot, options:opts, chosen,
       prereq:pick(chosen.prereq), conc:pick(chosen.conc), coreq:[], noSuggest:false};
  }else{
    e={code, disp:code, name:c.name, ico:c.ico, cr:c.cr, cat:c.cat, lane:c.lane, slot:null, options:null, chosen:null,
       prereq:pick(c.prereq), conc:pick(c.conc), coreq:pick(c.coreq), noSuggest:!!c.noSuggest};
  }
  effCache[code]=e; return e;
}
function totalCredits(){ return active().reduce((s,c)=>s+c.cr,0); }

/* ===================== Rules ===================== */
function isDone(code){ return P().completed.includes(code); }
function semOf(code){ const s=P().semesters; for(let i=0;i<s.length;i++) if(s[i].courses.includes(code)) return i; return -1; }
function semLabel(s){ return s.term.slice(0,2).toUpperCase()+String(s.year).slice(2); }
function credits(codes){ return codes.reduce((s,c)=>s+(byCode[c]?byCode[c].cr:0),0); }
/* what stops `code` from sitting in semester si */
function reqMissing(code, si, ignore=[]){
  const e=eff(code), out=[];
  for(const p of e.prereq){ if(ignore.includes(p)||isDone(p)) continue; const pi=semOf(p); if(pi<0||pi>=si) out.push({type:'req',kind:'before',code:p}); }
  for(const p of e.conc){ if(ignore.includes(p)||isDone(p)) continue; const pi=semOf(p); if(pi<0||pi>si) out.push({type:'req',kind:'with',code:p}); }
  return out;
}
/* planned courses that would break if `code` moved to semester si */
function depBlockers(code, si, ignore=[]){
  const out=[];
  for(const c of active()){
    if(ignore.includes(c.code)) continue;
    const di=semOf(c.code); if(di<0) continue;
    const e=eff(c.code);
    if(e.prereq.includes(code)){ if(!(si<di)) out.push({type:'dep',kind:'before',code:c.code}); }
    else if(e.conc.includes(code)){ if(!(si<=di)) out.push({type:'dep',kind:'with',code:c.code}); }
  }
  return out;
}
/* a course and the lab partners that travel with it */
function groupOf(code){ const g=[code]; for(const q of eff(code).coreq) if(!isDone(q)&&!g.includes(q)) g.push(q); return g; }
function placeCheck(codes, si){
  let r=[]; for(const c of codes) r=r.concat(reqMissing(c,si,codes), depBlockers(c,si,codes)); return r;
}
function reasonText(rs){
  const seen=new Set(), parts=[];
  for(const r of rs){ const k=r.type+r.code; if(seen.has(k)) continue; seen.add(k);
    parts.push(r.type==='req' ? (r.kind==='before'? `after <b>${disp(r.code)}</b>` : `with <b>${disp(r.code)}</b>`) : `before <b>${disp(r.code)}</b>`); }
  return parts.slice(0,2).join(' · ') + (parts.length>2? ` +${parts.length-2}`:'');
}
function disp(code){ const e=eff(code); return e? e.disp : code; }
function prereqDoneShallow(code){ const e=eff(code); return e.prereq.every(isDone) && e.conc.every(p=>isDone(p)||eff(p).prereq.every(isDone)); }
function isReady(code){ if(isDone(code)) return false; const e=eff(code); return prereqDoneShallow(code) && e.coreq.every(q=>isDone(q)||prereqDoneShallow(q)); }
function courseState(code){ if(isDone(code)) return 'done'; if(semOf(code)>=0) return 'planned'; return isReady(code)? 'avail':'locked'; }
function ancestors(code, acc=new Set()){ const e=eff(code); for(const p of [...e.prereq,...e.conc]){ if(!acc.has(p)){ acc.add(p); ancestors(p,acc); } } return acc; }
function descendants(code, acc=new Set()){
  for(const c of active()){ const e=eff(c.code); if((e.prereq.includes(code)||e.conc.includes(code)) && !acc.has(c.code)){ acc.add(c.code); descendants(c.code,acc); } }
  return acc;
}
/* keep the plan legal after anything changes: courses whose requirements vanished go back to the bank */
function enforceValidity(){
  const prof=P(), kicked=[];
  prof.completed=prof.completed.filter(exists);
  for(const s of prof.semesters) s.courses=s.courses.filter(exists);
  let changed=true, guard=0;
  while(changed && guard++<30){
    changed=false;
    for(let si=0; si<prof.semesters.length; si++){
      for(const code of [...prof.semesters[si].courses]){
        let bad = reqMissing(code,si).length>0;
        if(!bad) for(const q of eff(code).coreq){ if(!isDone(q)){ const qi=semOf(q); if(qi>=0 && qi!==si) bad=true; } }
        if(bad){ for(const x of groupOf(code)){ if(semOf(x)>=0){ detach(x); kicked.push(x); } } changed=true; }
      }
    }
  }
  return kicked;
}

/* ===================== Mutations ===================== */
function begin(){ snap(); effCache={}; }
function detach(code){ const p=P(); p.completed=p.completed.filter(x=>x!==code); for(const s of p.semesters) s.courses=s.courses.filter(x=>x!==code); }
function finish(msg, kind){
  const kicked=enforceValidity();
  if(kicked.length) toast(`↩ Back to the bank until their prerequisites are placed again: <b>${kicked.map(disp).join('</b>, <b>')}</b>`);
  if(msg) toast(msg, kind);
  save(); renderAll();
}
function placeGroup(codes, semId){
  const prof=P(); const s=prof.semesters.find(x=>x.id===semId); if(!s) return false;
  const si=prof.semesters.indexOf(s);
  if(placeCheck(codes,si).length) return false;
  if(codes.every(c=>s.courses.includes(c))) return true;
  begin();
  for(const c of codes){ detach(c); s.courses.push(c); }
  const tag = codes.length>1 ? ` 🧲 ${codes.slice(1).map(disp).join(', ')} came along` : '';
  finish(`📌 <b>${disp(codes[0])}</b> → ${s.term} ${s.year}${tag}`);
  return true;
}
function toBank(codes){
  begin(); for(const c of codes) detach(c);
  finish();
}
function toPast(codes, quiet){
  begin();
  const before = active().filter(c=>isReady(c.code)).map(c=>c.code);
  for(const c of codes){ detach(c); P().completed.push(c); }
  effCache={};
  const unlocked = active().filter(c=>isReady(c.code)&&!before.includes(c.code)).map(c=>disp(c.code));
  burst();
  if(quiet) finish();
  else if(unlocked.length) finish(`🔓 Unlocked: <b>${unlocked.join('</b>, <b>')}</b>`, 'good');
  else finish(`✔ <b>${codes.map(disp).join('</b>, <b>')}</b> completed!`, 'good');
}
function markDone(code, withChain){
  const codes = withChain ? [...ancestors(code), code].filter(c=>!isDone(c)) : [code];
  toPast(codes);
}
function unmarkDone(code){ begin(); P().completed=P().completed.filter(x=>x!==code); finish(`↩ <b>${disp(code)}</b> is back to not taken.`); }
function addSemester(silent){
  begin();
  const prof=P(); const last=prof.semesters[prof.semesters.length-1];
  const nxt = last? nextTerm(last.term,last.year) : currentTerm();
  const s={id:uid('s'), term:nxt.term, year:nxt.year, courses:[]};
  prof.semesters.push(s);
  if(!silent) finish();
  return s;
}
function removeSemester(idx){
  begin(); const prof=P(); const s=prof.semesters[idx];
  const n=s.courses.length; prof.semesters.splice(idx,1);
  finish(n? `↩ ${n} course(s) from ${s.term} ${s.year} returned to the bank.` : null);
}
function finishSemester(idx){
  const s=P().semesters[idx];
  if(!s.courses.length){ toast('Nothing in that semester yet.'); return; }
  const codes=[...s.courses];
  toPast(codes, true);
  toast(`🏁 ${s.term} ${s.year} finished — ${codes.length} course(s) moved to Past Courses.`, 'good');
}
function suggestFill(idx){
  const prof=P(); const s=prof.semesters[idx];
  const limit = s.term==='Summer'?6:16;
  let load=credits(s.courses);
  if(load>=limit){ toast(`${s.term} ${s.year} is already at ${load} cr.`); return; }
  begin();
  const cands = active()
    .filter(c=>!eff(c.code).noSuggest && !isDone(c.code) && semOf(c.code)<0)
    .sort((a,b)=>((a.lane||9)-(b.lane||9)) || (FILL_PRIORITY[a.cat]-FILL_PRIORITY[b.cat]) || a.code.localeCompare(b.code));
  const added=[];
  for(const c of cands){
    if(semOf(c.code)>=0) continue;
    const g=groupOf(c.code);
    if(g.some(x=>semOf(x)>=0)) continue;               // a lab partner is already pinned elsewhere
    const cost=credits(g); if(load+cost>limit) continue;
    if(placeCheck(g, idx).length) continue;
    for(const x of g){ s.courses.push(x); added.push(disp(x)); }
    load+=cost;
  }
  if(added.length){ finish(`✨ Suggested for ${s.term} ${s.year} (${load} cr): <b>${added.join('</b>, <b>')}</b>. Adjust as you like!`, 'good'); }
  else { undoStack.pop(); refreshUndo(); toast('Nothing else fits here yet — place its prerequisites in earlier terms first.'); }
}
function chooseOption(slotCode, optCode){
  const prof=P(); const si=semOf(slotCode);
  if(si>=0){ // only allow a swap that keeps the placement legal
    const prev=prof.choices[slotCode]; prof.choices[slotCode]=optCode; effCache={};
    const bad=reqMissing(slotCode,si).length; prof.choices[slotCode]=prev; effCache={};
    if(bad) return false;
  }
  begin(); prof.choices[slotCode]=optCode; effCache={};
  finish(`🎯 ${eff(slotCode).slot}: <b>${optCode}</b>`);
  return true;
}
function setCatalog(prof, cat){
  if(prof.catalog===cat) return;
  begin(); prof.catalog=cat; effCache={};
  finish(`📚 Switched to the ${CATALOGS[cat].label} catalog.`);
}

/* ===================== Layout: skill tree ===================== */
const NODE_W=196, ROW_H=80, COL_GAP=104, PAD_X=46, PAD_TOP=56;
const treeWrap=document.getElementById('treeWrap'), treeCanvas=document.getElementById('treeCanvas'), edgeSvg=document.getElementById('edgeSvg'), tooltip=document.getElementById('tooltip');
let pos={}, canvasSize={w:0,h:0,bandTop:0}, edgeEls=[], layoutKey=null;

function computeLayout(){
  const A=active(); const lanes={0:[],1:[],2:[],3:[],4:[]}; A.forEach(c=>lanes[c.lane].push(c));
  const catOrder=['math','sci','fnd','wri','core','elec','ger','free'];
  const cmp=(a,b)=>catOrder.indexOf(a.cat)-catOrder.indexOf(b.cat)||a.code.localeCompare(b.code);
  const y={}; lanes[1].forEach((c,i)=>y[c.code]=i);
  for(let l=2;l<=4;l++){
    const L=lanes[l], bary={}, inLane=new Set(L.map(c=>c.code)), seen=new Set(), order=[];
    const visit=c=>{ if(seen.has(c.code)) return; seen.add(c.code); const e=eff(c.code); [...e.prereq,...e.conc,...e.coreq].forEach(p=>{ if(inLane.has(p)) visit(byCode[p]); }); order.push(c); };
    L.slice().sort(cmp).forEach(visit);
    // each course sits near the average row of what it needs
    for(const c of order){ const e=eff(c.code); const refs=[...e.prereq,...e.conc,...e.coreq].map(p=>y[p]!=null? y[p] : bary[p]).filter(v=>v!=null); if(refs.length) bary[c.code]=refs.reduce((a,b)=>a+b,0)/refs.length; }
    // courses with nothing upstream sit near what they unlock
    for(const c of L){ if(bary[c.code]!=null) continue; const deps=A.filter(d=>{const e=eff(d.code); return e.prereq.includes(c.code)||e.conc.includes(c.code);}).map(d=>bary[d.code]).filter(v=>v!=null); bary[c.code]= deps.length? deps.reduce((a,b)=>a+b,0)/deps.length : 99; }
    L.sort((a,b)=>(bary[a.code]-bary[b.code]) || cmp(a,b));
    // keep same-column prerequisites above their dependents
    for(let pass=0;pass<6;pass++){ let moved=false;
      for(let i=0;i<L.length && !moved;i++){ const e=eff(L[i].code);
        for(const p of [...e.prereq,...e.conc]){ const j=L.findIndex(x=>x.code===p); if(j>i){ const [it]=L.splice(i,1); L.splice(j,0,it); moved=true; break; } } }
      if(!moved) break; }
    L.forEach((c,i)=>y[c.code]=i);
  }
  pos={}; let maxRows=0;
  for(let l=1;l<=4;l++){ const x=PAD_X+(l-1)*(NODE_W+COL_GAP); lanes[l].forEach((c,i)=>{ pos[c.code]={x, y:PAD_TOP+i*ROW_H}; }); maxRows=Math.max(maxRows, lanes[l].length); }
  const bandTop=PAD_TOP+maxRows*ROW_H+56, perRow=5, gx=28, gy=78;
  lanes[0].forEach((c,i)=>{ pos[c.code]={x:PAD_X+(i%perRow)*(NODE_W+gx), y:bandTop+Math.floor(i/perRow)*gy}; });
  canvasSize={ w:Math.max(PAD_X*2+4*NODE_W+3*COL_GAP, PAD_X*2+perRow*(NODE_W+gx)), h:bandTop+Math.ceil(lanes[0].length/perRow)*gy+40, bandTop };
}
function cssId(code){ return code.replace(/[^A-Za-z0-9]/g,'_'); }
function buildTree(){
  computeLayout();
  treeCanvas.innerHTML=''; treeCanvas.appendChild(edgeSvg); edgeSvg.innerHTML=''; edgeEls=[];
  treeCanvas.style.width=canvasSize.w+'px'; treeCanvas.style.height=canvasSize.h+'px';
  edgeSvg.setAttribute('width',canvasSize.w); edgeSvg.setAttribute('height',canvasSize.h);
  ['First Year','Second Year','Third Year','Fourth Year'].forEach((t,i)=>{
    const el=document.createElement('div'); el.className='lane-label'; el.textContent=t;
    el.style.left=(PAD_X+i*(NODE_W+COL_GAP))+'px'; el.style.width=NODE_W+'px'; treeCanvas.appendChild(el);
  });
  const bl=document.createElement('div'); bl.className='band-label'; bl.textContent='General Education · Free Electives';
  bl.style.left=PAD_X+'px'; bl.style.top=(canvasSize.bandTop-30)+'px'; treeCanvas.appendChild(bl);
  const A=active();
  for(const c of A){ const e=eff(c.code);
    for(const p of e.prereq) addEdge(p,c.code,'pre');
    for(const p of e.conc) addEdge(p,c.code,'conc');
    for(const q of e.coreq) if(q<c.code) addEdge(q,c.code,'coreq');
  }
  for(const c of A){
    const e=eff(c.code);
    const n=document.createElement('div'); n.className='node'; n.id='node-'+cssId(c.code); n.tabIndex=0;
    n.style.left=pos[c.code].x+'px'; n.style.top=pos[c.code].y+'px'; n.style.setProperty('--cat', CATS[c.cat].col);
    n.innerHTML=`<span class="ico">${e.ico}</span><span class="tx"><span class="code">${e.disp}${e.options?`<span class="opt">▾ ${e.options.length} options</span>`:''}</span><span class="nm">${e.name}</span></span><span class="cr">${e.cr} cr</span><span class="st"></span><span class="semtag" hidden></span>`;
    n.addEventListener('click', ev=>{ ev.stopPropagation(); openPop(c.code, n.getBoundingClientRect()); });
    n.addEventListener('keydown', ev=>{ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); openPop(c.code, n.getBoundingClientRect()); } });
    n.addEventListener('mouseenter', ev=>{ if(!pinned) highlight(c.code,true); showTip(c.code,ev); });
    n.addEventListener('mousemove', moveTip);
    n.addEventListener('mouseleave', ()=>{ if(!pinned) highlight(c.code,false); tooltip.style.display='none'; });
    treeCanvas.appendChild(n);
  }
  layoutKey=P().catalog+JSON.stringify(P().choices);
  if(!fitted) fitZoom(); else applyZoom();
}
function addEdge(from,to,kind){
  if(!pos[from]||!pos[to]) return;
  const a=pos[from], b=pos[to], ax=a.x+NODE_W, ay=a.y+30, bx=b.x, by=b.y+30; let d;
  if(Math.abs(a.x-b.x)<4){ const x=a.x, off=26; d=`M ${x} ${ay} C ${x-off} ${ay}, ${x-off} ${by}, ${x} ${by}`; }
  else if(bx>ax-10){ const mx=(ax+bx)/2; d=`M ${ax} ${ay} C ${mx} ${ay}, ${mx} ${by}, ${bx} ${by}`; }
  else { d=`M ${a.x} ${ay} C ${a.x-60} ${ay}, ${b.x+NODE_W+60} ${by}, ${b.x+NODE_W} ${by}`; }
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d',d); path.setAttribute('class','edge '+(kind==='pre'?'':kind)); path.dataset.from=from; path.dataset.to=to;
  edgeSvg.appendChild(path); edgeEls.push(path);
}
function highlight(code,on){
  const up=on?ancestors(code):new Set(), down=on?descendants(code):new Set();
  for(const c of active()){ const el=document.getElementById('node-'+cssId(c.code)); if(!el) continue;
    el.classList.remove('hl-up','hl-down','hl-dim'); if(!on||c.code===code) continue;
    if(up.has(c.code)) el.classList.add('hl-up'); else if(down.has(c.code)) el.classList.add('hl-down'); else el.classList.add('hl-dim'); }
  for(const e of edgeEls){ e.classList.remove('up','down','dim'); if(!on) continue; const f=e.dataset.from,t=e.dataset.to;
    if((up.has(f)||f===code)&&(up.has(t)||t===code)) e.classList.add('up');
    else if((down.has(f)||f===code)&&(down.has(t)||t===code)) e.classList.add('down'); else e.classList.add('dim'); }
}
function stateLabel(code){
  const st=courseState(code), si=semOf(code);
  return {done:'<span style="color:var(--green)">✔ Completed</span>', avail:'<span style="color:#A57C00">⚡ Ready to take</span>',
    planned:`<span style="color:#2456C4">📌 Planned for ${si>=0? P().semesters[si].term+' '+P().semesters[si].year : ''}</span>`,

}
function reqLine(code){

  if(!h) h='<div class="t-req">No prerequisites</div>';

}
function showTip(code,ev){

const colsEl=document.getElementById('cols'), bankList=document.getElementById('bankList');

function buildPlanner(){
  const prof=P(), A=active(), total=totalCredits();
  let un=A.filter(c=>!isDone(c.code)&&semOf(c.code)<0);
  document.getElementById('bankCount').textContent=`${un.length} left · ${credits(un.map(c=>c.code))} cr`;
  if(bankQuery) un=un.filter(c=>{ const e=eff(c.code); return (e.disp+' '+e.name+' '+(e.options? e.options.map(o=>o.code+' '+o.name).join(' '):'')).toLowerCase().includes(bankQuery); });
  bankList.innerHTML='';
  if(!un.length){ const d=document.createElement('div'); d.className='bank-empty'; d.textContent= bankQuery? `No courses match “${bankQuery}”.` : 'Every course is planned or completed. 🎉'; bankList.appendChild(d); }
  for(const key of Object.keys(CATS)){
    const items=un.filter(c=>c.cat===key); if(!items.length) continue;
    const hd=document.createElement('div'); hd.className='bank-cat'; hd.textContent=CATS[key].label; bankList.appendChild(hd);
    const wrap=document.createElement('div'); wrap.style.cssText='display:flex;flex-direction:column;gap:6px;';
    items.forEach(c=>wrap.appendChild(chipEl(c.code,'bank'))); bankList.appendChild(wrap);
  }
  colsEl.innerHTML='';
  colsEl.appendChild(semColEl({past:true}));
  let cum=credits(prof.completed), gradShown=false; const now=currentTerm();
  prof.semesters.forEach((s,i)=>{
    const load=credits(s.courses); cum+=load;
    const grad = !gradShown && cum>=total && load>0; if(grad) gradShown=true;
    colsEl.appendChild(semColEl({sem:s, idx:i, load, cum, grad, isNow:s.term===now.term&&s.year===now.year}));
  });
  const add=document.createElement('button'); add.id='addSem'; add.textContent='＋ ADD SEMESTER'; add.title='Add the next term';
  add.addEventListener('click', ()=>addSemester()); colsEl.appendChild(add);
}
function semColEl({past, sem, idx, load, cum, grad, isNow}){
  const col=document.createElement('div'); col.className='sem-col'+(past?' past':''); col.dataset.drop= past?'past':'sem:'+sem.id;
  const prof=P(); const codes= past? prof.completed : sem.courses;
  col.style.setProperty('--mk', past? '#26303E' : MARKERS[sem.year%MARKERS.length]);
  const title = past? `<span class="term">PAST COURSES</span>` : `<span class="term">${sem.term.toUpperCase()}</span><span class="yr">${sem.year}</span>${isNow?'<span class="now">NOW</span>':''}`;
  const tools = past? '' : `<span class="col-tools"><button class="col-fill" title="Suggest courses that fit this semester">✨</button><button class="col-done" title="Semester finished — move everything here to Past Courses">✓</button><button class="col-x" title="Remove this semester (its courses return to the bank)">✕</button></span>`;
  col.innerHTML=`<div class="col-head">${title}${tools}</div><div class="col-body"></div><div class="col-lock"></div>`;
  const body=col.querySelector('.col-body');
  codes.forEach(code=>{ if(byCode[code]) body.appendChild(chipEl(code, past?'past':'sem', idx)); });
  const foot=document.createElement('div'); foot.className='col-foot';
  if(past) foot.innerHTML=`<span class="load"><b>${credits(codes)}</b> cr earned</span>`;
  else { const limit= sem.term==='Summer'?7:18;
    foot.innerHTML=`<span class="load${load>limit?' over':''}" title="${load>limit?'Above the usual '+limit+' cr load — needs advisor approval':''}"><b>${load}</b> cr</span><span class="cum${grad?' grad':''}">${grad?'🎓 ':''}Σ <b>${cum}</b></span>`; }
  col.appendChild(foot);
  if(!past){
    col.querySelector('.col-x').addEventListener('click', ()=>removeSemester(idx));
    col.querySelector('.col-done').addEventListener('click', ()=>finishSemester(idx));
    col.querySelector('.col-fill').addEventListener('click', ()=>suggestFill(idx));
  }
  return col;
}
function rotFor(code){ let h=0; for(const ch of code) h=(h*31+ch.charCodeAt(0))|0; return ((Math.abs(h)%29)/10-1.4).toFixed(1)+'deg'; }
function chipEl(code, where, semIdx){
  const e=eff(code); const el=document.createElement('div');
  el.className='chip'+(where==='past'?' compact':''); el.tabIndex=0; el.dataset.code=code;
  el.style.setProperty('--cat', CATS[e.cat].col); if(where!=='bank') el.style.setProperty('--rot', rotFor(code));
  el.title=`${e.disp} — ${e.name}`;
  el.innerHTML=`<span class="ico">${e.ico}</span><span class="tx"><span class="code">${e.disp}</span><span class="nm">${e.name}</span></span><span class="cr">${e.cr}</span>${e.coreq.length?'<span class="lab" title="Moves together with its lab/lecture">🧲</span>':''}`;
  attachDrag(el, code);
  el.addEventListener('keydown', ev=>{ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); openPop(code, el.getBoundingClientRect()); } });
  return el;
}

/* ---- drag (mouse / pen) — tap opens the action card on every device ---- */
let drag=null, suppressClick=false;
function attachDrag(el, code){
  el.addEventListener('pointerdown', e=>{
    if(e.pointerType==='touch' || e.button!==0) return;
    e.preventDefault();
    drag={code, group:groupOf(code), srcEl:el, startX:e.clientX, startY:e.clientY, ghost:null, active:false};
    window.addEventListener('pointermove', onDragMove);
    window.addEventListener('pointerup', onDragUp, {once:true});
  });
  el.addEventListener('click', e=>{ if(suppressClick){ suppressClick=false; return; } e.stopPropagation(); openPop(code, el.getBoundingClientRect()); });
}
function onDragMove(e){
  if(!drag) return;
  if(!drag.active){
    if(Math.hypot(e.clientX-drag.startX, e.clientY-drag.startY)<6) return;
    drag.active=true; closePop();
    drag.ghost=drag.srcEl.cloneNode(true); drag.ghost.classList.add('ghost'); document.body.appendChild(drag.ghost);
    drag.srcEl.classList.add('drag-src');
    // lock every semester this course can't legally sit in
    const prof=P(); drag.blocked=new Set();
    document.querySelectorAll('.sem-col[data-drop^="sem:"]').forEach(col=>{
      const id=col.dataset.drop.slice(4), si=prof.semesters.findIndex(s=>s.id===id);
      const rs = prof.semesters[si].courses.includes(drag.code)? [] : placeCheck(drag.group, si);
      if(rs.length){ drag.blocked.add(id); col.classList.add('blocked'); col.querySelector('.col-lock').innerHTML='🔒 '+reasonText(rs); }
    });
  }
  drag.ghost.style.left=(e.clientX-90)+'px'; drag.ghost.style.top=(e.clientY-20)+'px';
  document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));
  const t=dropTargetAt(e.clientX,e.clientY);
  if(t && !t.el.classList.contains('blocked')) t.el.classList.add('drag-over');
}
function dropTargetAt(x,y){ const el=document.elementFromPoint(x,y); if(!el) return null; const z=el.closest('[data-drop]'); return z? {el:z,key:z.dataset.drop}:null; }
function onDragUp(e){
  window.removeEventListener('pointermove', onDragMove);
  document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));
  if(!drag) return;
  const d=drag; drag=null;
  if(d.ghost) d.ghost.remove(); d.srcEl.classList.remove('drag-src');
  if(!d.active){ return; }             // a plain click → the click handler opens the card
  suppressClick=true; setTimeout(()=>suppressClick=false, 50);
  const t=dropTargetAt(e.clientX,e.clientY);
  document.querySelectorAll('.sem-col.blocked').forEach(c=>{ c.classList.remove('blocked'); c.querySelector('.col-lock').innerHTML=''; });
  if(!t) return;
  if(t.key.startsWith('sem:') && d.blocked.has(t.key.slice(4))){
    // dropped on a locked semester → it bounces back, nothing changes
    t.el.classList.remove('shake'); void t.el.offsetWidth; t.el.classList.add('shake'); return;
  }
  if(t.key==='past') toPast(d.group);
  else if(t.key==='bank'){ if(d.group.some(c=>semOf(c)>=0||isDone(c))) toBank(d.group); }
  else if(t.key.startsWith('sem:')) placeGroup(d.group, t.key.slice(4));
}

/* ===================== HUD ===================== */
const lastLevel={};
function refreshHud(){
  const prof=P(), total=totalCredits();
  const done=credits(prof.completed), planned=prof.semesters.reduce((s,x)=>s+credits(x.courses),0);
  const pctD=Math.min(100, done/total*100), pctP=Math.min(100-pctD, planned/total*100);
  document.getElementById('xpDone').style.width=pctD+'%'; document.getElementById('xpPlanned').style.width=pctP+'%';
  document.getElementById('xpLabel').innerHTML=`<b>${done}</b> done · ${planned} planned / ${total} cr`;
  const lvl = done>=total ? 4 : Math.min(3, Math.floor(done/total*4));
  document.getElementById('levelBadge').textContent=LEVELS[lvl];
  if(lastLevel[prof.id]!=null && lvl>lastLevel[prof.id]) toast(`⬆ Level up! You’re now a <b>${LEVELS[lvl]}</b>`, 'gold');
  lastLevel[prof.id]=lvl;
  const eta=document.getElementById('eta');
  if(done+planned>=total){
    let last=-1; prof.semesters.forEach((s,i)=>{ if(s.courses.length) last=i; });
    eta.className='eta grad'; eta.textContent= last>=0? `🎓 Graduating ${prof.semesters[last].term} ${prof.semesters[last].year}` : '🎓 Degree complete';
    if(!window.__gradFired){ window.__gradFired=true; celebrate(); }
  }else{ eta.className='eta'; eta.textContent=`${total-done-planned} cr still to plan`; window.__gradFired=false; }
  document.getElementById('catPill').innerHTML=`<b>${CATALOGS[prof.catalog].label}</b> catalog · ${active().length} courses · ${total} cr`;
}

  const sel=document.getElementById('profileSel'); sel.innerHTML='';

}
document.getElementById('profileSel').addEventListener('change', e=>{ state.activeId=e.target.value; undoStack=[]; refreshUndo(); effCache={}; save(); renderAll(); });

/* ---- share: the whole plan travels inside the link ---- */
const enc=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const dec=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))));
function shareUrl(){ return location.origin+location.pathname+'#p='+enc(JSON.stringify(P())); }
function importProfile(raw){
  let txt=raw.trim(); const m=txt.match(/#p=([A-Za-z0-9\-_]+)/); if(m) txt=dec(m[1]);
  const p=sanitizeProfile(JSON.parse(txt)); if(!p) throw new Error('bad');
  const ex=state.profiles.findIndex(x=>x.id===p.id);
  if(ex>=0) state.profiles[ex]=p; else state.profiles.push(p);
  state.activeId=p.id; undoStack=[]; refreshUndo(); effCache={};
  enforceValidity(); save(); renderAll();
  return {name:p.name, replaced:ex>=0};
}
function copyText(txt, okMsg){
  const done=()=>toast(okMsg,'good');
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, ()=>fallbackCopy(txt,done));
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt, done){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){} ta.remove(); }
document.getElementById('shareBtn').addEventListener('click', ()=>{

  openModal(`<h2>🔗 Share this plan</h2>

    <label class="f" for="shPaste">Load a plan from a link or code</label>
    <textarea id="shPaste" placeholder="Paste a Course Quest link (or a plan code) here"></textarea>
    <div class="row"><button class="btn" data-close>Close</button><button class="btn" id="shCode">Copy plan code</button><button class="btn primary" id="shLoad">Load</button></div>`,
    ()=>{
      document.getElementById('shCopy').addEventListener('click', ()=>copyText(url,'Link copied!'));
      document.getElementById('shCode').addEventListener('click', ()=>copyText(JSON.stringify(P()),'Plan code copied!'));

    });

function fitZoom(){ if(!treeWrap.clientWidth || !canvasSize.w) return; zoom=Math.max(0.45, Math.min(1.15, (treeWrap.clientWidth-24)/canvasSize.w)); applyZoom(); fitted=true; }

/* ===================== Toast & confetti ===================== */
function toast(html, kind){
  const t=document.createElement('div'); t.className='toast'+(kind?' '+kind:''); t.innerHTML=html;
  const box=document.getElementById('toasts'); box.appendChild(t); while(box.children.length>4) box.firstChild.remove();
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .4s'; setTimeout(()=>t.remove(),400); }, 4200);
}
const cvs=document.getElementById('confetti'), ctx=cvs.getContext('2d');
let parts=[], rafId=null;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resizeCvs(){ cvs.width=innerWidth; cvs.height=innerHeight; }
addEventListener('resize', resizeCvs); resizeCvs();
function spawn(n, spread){
  const colors=['#F2C230','#2FA96F','#2F5FD0','#D6478F','#7A4FC9','#E8862E'];
  for(let i=0;i<n;i++) parts.push({x:innerWidth/2+(Math.random()-0.5)*spread, y:-14, vx:(Math.random()-0.5)*7, vy:2+Math.random()*4, r:3+Math.random()*4, a:Math.random()*Math.PI, va:(Math.random()-0.5)*0.3, col:colors[Math.floor(Math.random()*colors.length)], life:130+Math.random()*80});
  if(!rafId) tick();
}
function tick(){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  parts=parts.filter(p=>p.life>0 && p.y<cvs.height+20);
  for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; p.a+=p.va; p.life--; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.col; ctx.globalAlpha=Math.min(1,p.life/40); ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r); ctx.restore(); }
  rafId = parts.length? requestAnimationFrame(tick) : null;
  if(!parts.length) ctx.clearRect(0,0,cvs.width,cvs.height);
}
function burst(){ if(!reduceMotion) spawn(26, innerWidth*0.5); }
function celebrate(){ if(!reduceMotion) spawn(220, innerWidth*0.9); toast('🎓 <b>QUEST COMPLETE!</b> The whole degree is planned. Congratulations!','gold'); }

/* ===================== Boot ===================== */
function renderAll(){ effCache={}; refreshProfiles(); refreshTree(); buildPlanner(); refreshHud(); }
state=load();
(function boot(){
  const m=location.hash.match(/#p=([A-Za-z0-9\-_]+)/);
  if(m){
    if(!state) state={profiles:[], activeId:null, ui:{}};
    try{ const r=importProfile(location.hash); history.replaceState(null,'',location.pathname+location.search); toast(`Opened plan for <b>${r.name}</b>`,'good'); }
    catch(e){ toast('That link didn’t contain a readable plan.','bad'); }
  }
  if(state && state.profiles.length){
    setTab((state.ui&&state.ui.tab)||'tree'); renderAll(); refreshUndo();
  }else{
    state={profiles:[], activeId:null, ui:{}}; setTab('tree');
    newStudentDialog(true);
  }
})();
